# Sobe o sistema inteiro: SQL Server + criacao do banco + API.
#
#   Copy-Item .env.example .env     (e edite os valores)
#   docker compose up --build
#
# API e admin:  http://localhost:8080/admin      Saude: http://localhost:8080/health
# Para derrubar:            docker compose down
# Para apagar tambem os dados (banco e fotos):   docker compose down -v

name: lavaipizza

services:
  # ------------------------------------------------------------ banco de dados
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express            # edicao gratuita
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Defina SA_PASSWORD no arquivo .env}
    volumes:
      - dados-sql:/var/opt/mssql    # o banco sobrevive a "docker compose down"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ------------------------------------------------------------ cria o banco na primeira vez
  # O script apaga e recria o banco, entao so roda se o LaVaiPizzaDb ainda nao existir.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Defina SA_PASSWORD no arquivo .env}
    volumes:
      - ./scripts/script_banco.sql:/scripts/script_banco.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        SQLCMD="/opt/mssql-tools18/bin/sqlcmd -C -S db -U sa -P $$MSSQL_SA_PASSWORD"
        existe=$$($$SQLCMD -h -1 -W -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.databases WHERE name = 'LaVaiPizzaDb'" | tr -d '[:space:]')
        if [ "$$existe" = "0" ]; then
          echo "Criando o banco LaVaiPizzaDb (tabelas, triggers, procedures e dados de demonstracao)..."
          $$SQLCMD -b -I -f 65001 -i /scripts/script_banco.sql
          echo "Banco criado."
        else
          echo "O banco LaVaiPizzaDb ja existe: nada a fazer."
        fi
    restart: "no"

  # ------------------------------------------------------------ API + admin
  api:
    build: .
    depends_on:
      db-init:
        condition: service_completed_successfully
    ports:
      - "${PORTA_API:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Server=db;Database=LaVaiPizzaDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;
      Jwt__Key: ${JWT_KEY:?Defina JWT_KEY no arquivo .env (minimo 32 caracteres)}
      Site__UrlBase: ${SITE_URL:-http://localhost:5500/}
      # Origens liberadas no CORS: as de appsettings.json. Para incluir outra, acrescente aqui:
      # Cors__AllowedOrigins__6: https://meu-site.exemplo.com
      #
      # Atras de um proxy reverso (nginx, Traefik...), habilite para o limite de requisicoes por IP
      # enxergar o IP real do cliente (so faca isso se a API NAO estiver exposta direto):
      # ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    volumes:
      - fotos-pizzas:/app/wwwroot/uploads   # fotos enviadas pelo admin
    healthcheck:
      # A imagem nao tem curl; o bash consegue abrir a conexao e ler a primeira linha da resposta
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q 200"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  dados-sql:
  fotos-pizzas:
